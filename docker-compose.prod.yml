name: local-ai-coding-assistant-prod

services:
  backend:
    build:
      context: ./backend
      args:
        APP_UID: "${APP_UID:-1000}"
    env_file:
      - ./backend/.env
    environment:
      APP_ENVIRONMENT: production
      APP_DEBUG: "false"
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      CREDENTIALS_FILE: /app/data/config/credentials.json
      LOCAL_SETTINGS_FILE: /app/data/config/app-settings.json
      DATA_DIRECTORY: /app/data
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - "${LOCAL_REPOS_ROOT:-.}:/repositories:ro"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${FRONTEND_API_BASE_URL:-auto}"
        VITE_USE_MOCK_API: "${FRONTEND_USE_MOCK_API:-false}"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - "http://127.0.0.1/"
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

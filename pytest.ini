[pytest]
testpaths = tests
pythonpath = backend
addopts = -ra
markers =
    unit: isolated tests that do not require external services
    integration: in-process integration tests with local fakes or temporary files
    slow: slower regression tests
    ollama: optional tests that require a live Ollama daemon and are skipped unless RUN_OLLAMA_TESTS=1
    ollama_smoke: optional CPU-friendly live Ollama app-flow smoke tests
    documents: document upload, extraction, chunking, and indexing tests
    vector: local vector indexing and retrieval tests
    rag: retrieval-augmented chat tests
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning

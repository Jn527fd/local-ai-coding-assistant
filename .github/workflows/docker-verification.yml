name: Docker Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-tests:
    name: Dockerized backend and frontend tests
    runs-on: ubuntu-latest
    env:
      RUN_OLLAMA_TESTS: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Dockerized test suite
        run: docker compose -f docker-compose.test.yml run --rm backend-test

      - name: Run Dockerized frontend suite
        run: docker compose -f docker-compose.test.yml run --rm frontend-test

      - name: Tear down Docker test services
        if: always()
        run: docker compose -f docker-compose.test.yml down --remove-orphans

            requestId: req_size_example
    UnsupportedMediaTypeError:
      description: An uploaded file type is not supported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: validation
            message: The uploaded file type is not supported.
            requestId: req_media_example
    ServerError:
      description: Backend or dependency failure
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: server

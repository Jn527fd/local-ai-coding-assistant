            code: validation
            message: The title is required.
            requestId: req_validation_example
            fieldErrors:
              title: Enter a conversation title.
    UnauthorizedError:
      description: Authentication is missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: unauthorized
            message: Sign in to continue.
            requestId: req_auth_example
    ForbiddenError:
      description: The authenticated user is not allowed to perform the operation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: forbidden
            message: You do not have permission to access this conversation.
            requestId: req_forbidden_example
    NotFoundError:
      description: Resource not found or not visible to the current user
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: not_found
            message: The requested resource was not found.
            requestId: req_not_found_example
    ConflictError:
      description: Request conflicts with the current resource state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: conflict
            message: The resource changed. Reload and try again.
            requestId: req_conflict_example
    RateLimitedError:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
          example: 30
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            code: rate_limited
            message: Too many requests. Try again shortly.
            requestId: req_rate_example
    PayloadTooLargeError:
      description: A file or request exceeds the configured size limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:

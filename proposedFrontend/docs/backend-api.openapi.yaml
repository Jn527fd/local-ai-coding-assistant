          maximum: 26214400
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [uploading, processing, ready, failed]
        summary:
          type: array
          items:
            type: string
        error:
          type: string
    AvailableModel:
      type: object
      additionalProperties: false
      required: [id, label, capability, available]
      properties:
